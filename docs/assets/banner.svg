<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Automated GDD</title>
  <desc id="description">A game development skill connecting current design, gameplay values, and separate experiments.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset="1" stop-color="#172d3c"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7094a8" stroke-opacity=".09"/></pattern>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#52e1bb"/><stop offset="1" stop-color="#9cf1d3"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect x="58" y="58" width="124" height="27" rx="13.5" fill="#52e1bb" fill-opacity=".12"/>
  <text x="75" y="76" fill="#79e8c9" font-size="11" font-weight="700" letter-spacing="1.6" font-family="Arial,sans-serif">AGENT SKILL</text>
  <text x="58" y="155" fill="#f0f7fb" font-size="58" font-weight="700" letter-spacing="-2" font-family="Arial,sans-serif">Automated GDD</text>
  <text x="61" y="202" fill="#b2c6d1" font-size="22" font-family="Arial,sans-serif">Game design your AI agent can keep up with.</text>
  <path d="M61 243H604" stroke="#6c96a7" stroke-opacity=".3"/>
  <text x="61" y="277" fill="#86a5b5" font-size="14" letter-spacing=".7" font-family="Arial,sans-serif">CURRENT DESIGN</text>
  <circle cx="222" cy="272" r="3" fill="#52e1bb"/>
  <text x="238" y="277" fill="#86a5b5" font-size="14" letter-spacing=".7" font-family="Arial,sans-serif">LINKED VALUES</text>
  <circle cx="392" cy="272" r="3" fill="#52e1bb"/>
  <text x="408" y="277" fill="#86a5b5" font-size="14" letter-spacing=".7" font-family="Arial,sans-serif">ROOM TO EXPERIMENT</text>
  <path d="M833 126H920M833 209H920" stroke="#52e1bb" stroke-opacity=".55" stroke-width="2"/>
  <rect x="751" y="89" width="110" height="165" rx="14" fill="#1b3644" stroke="#426777"/>
  <path d="M779 120H822M779 139H832M779 158H815" stroke="#6e94a5" stroke-width="5" stroke-linecap="round"/>
  <rect x="774" y="187" width="63" height="43" rx="8" fill="#52e1bb" fill-opacity=".12"/>
  <text x="786" y="215" fill="#79e8c9" font-family="monospace" font-size="24">{ }</text>
  <rect x="920" y="93" width="215" height="72" rx="12" fill="#173d3d" stroke="#52e1bb" stroke-opacity=".6"/>
  <text x="940" y="119" fill="#99b7bf" font-size="11" font-family="Arial,sans-serif" letter-spacing="1.4">ACCEPTED DESIGN</text>
  <text x="940" y="146" fill="#a4f1d6" font-size="20" font-weight="700" font-family="monospace">dash = 4 m</text>
  <rect x="920" y="181" width="215" height="72" rx="12" fill="#283445" stroke="#9db2cf" stroke-opacity=".55" stroke-dasharray="5 5"/>
  <text x="940" y="207" fill="#99aec4" font-size="11" font-family="Arial,sans-serif" letter-spacing="1.4">TEST ARENA ONLY</text>
  <text x="940" y="234" fill="#e2eaf7" font-size="20" font-weight="700" font-family="monospace">dash = 8 m</text>
</svg>
